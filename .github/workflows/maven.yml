name: ThingsBoard CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-common-data:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Test Common Data Module
      run: mvn clean test -pl common/data -am -B

  e2e-login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v3

    - name: Start ThingsBoard (Docker)
      run: |
        docker run -d --name tb -p 8080:8080 thingsboard/tb-postgres:latest
        for i in {1..60}; do
          if curl -fsS http://localhost:8080/login | grep -q 'username-input'; then
            exit 0
          fi
          sleep 5
        done
        docker logs tb
        exit 1

    - name: Set up Node 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Install Playwright
      run: |
        cd e2e
        npm ci
        npx playwright install --with-deps

    - name: Run E2E login test
      env:
        TB_BASE_URL: http://localhost:8080
        TB_SYSADMIN_USER: sysadmin@thingsboard.org
        TB_SYSADMIN_PASS: sysadmin
      run: |
        cd e2e
        npx playwright test --reporter=list

    - name: Stop ThingsBoard
      if: always()
      run: docker rm -f tb
